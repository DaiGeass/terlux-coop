# ============================================
# TERLUX COOP — Intranet (reverse proxy)
# Expone la web (contenedor web:8443) en el
# puerto 80 del host con el dominio de la intranet.
# Uso: docker compose --profile intranet up
# ============================================

server {
    listen 80;
    server_name intranet.terluxcoop.internal terluxcoop.internal _;

    location / {
        proxy_pass http://web:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}