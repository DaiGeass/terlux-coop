name: Build desktop (Windows / Linux / macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "public/descargas/**"
      - "*.md"
      - "*.txt"

permissions:
  contents: write

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: appimage,deb
          - os: macos-latest
            bundles: dmg,app
            universal: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
          # linuxdeploy (gtk plugin) espera libffi.so.7; runners recientes traen solo .so.8
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libffi.so.8 /usr/lib/x86_64-linux-gnu/libffi.so.7 || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build app
        working-directory: desktop
        run: |
          if [ "${{ matrix.universal }}" = "true" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            npx tauri build --target universal-apple-darwin --bundles ${{ matrix.bundles }}
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: List artifacts
        run: find desktop/src-tauri/target -path "*/release/bundle" -type d -exec find "{}" -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) \; | head -20
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terlux-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          retention-days: 30

  publish:
    name: Publish installers to public/descargas
    needs: tauri
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: terlux-desktop-*
          path: dist
          merge-multiple: true

      - name: Stage installers into public/descargas
        run: |
          VERSION=$(grep -o '"version"[^,]*' desktop/src-tauri/tauri.conf.json | head -1 | grep -o '[0-9][0-9.]*')
          echo "Publishing desktop v$VERSION"
          mkdir -p public/descargas
          strip_canon() {
            find dist -type f -name "$1" | head -1 | while read -r f; do
              cp "$f" "public/descargas/$2" && echo "  -> public/descargas/$2"
            done
          }
          strip_canon '*_x64-setup.exe'    "TerLux.Coop_${VERSION}_x64-setup.exe"
          strip_canon '*_x64_en-US.msi'    "TerLux.Coop_${VERSION}_x64_en-US.msi"
          strip_canon '*_amd64.deb'        "TerLux.Coop_${VERSION}_amd64.deb"
          strip_canon '*_amd64.AppImage'   "TerLux.Coop_${VERSION}_amd64.AppImage"
          strip_canon '*_universal.dmg'    "TerLux.Coop_${VERSION}_universal.dmg"

      - name: Commit installers if changed
        if: always()
        run: |
          if git status --porcelain public/descargas | grep -q .; then
            VERSION=$(grep -o '"version"[^,]*' desktop/src-tauri/tauri.conf.json | head -1 | grep -o '[0-9][0-9.]*')
            git config user.name "terlux-ci"
            git config user.email "ci@terluxcoop.local"
            git add public/descargas
            git commit -m "Publicar instaladores v${VERSION} (workflow git)"
            for i in 1 2 3; do
              if git push origin HEAD:main 2>/dev/null; then break; fi
              git pull --rebase origin main || true
            done
          else
            echo "No changes in public/descargas"
          fi

  release:
    name: Publish GitHub Release
    needs: tauri
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: terlux-desktop-*
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.dmg
          draft: true
          generate_release_notes: true