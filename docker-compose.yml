name: terlux-coop

services:
  postgres:
    image: postgres:16-alpine
    container_name: terlux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: terlux-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terlux_storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terlux_storage}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  web-migrate:
    image: terlux-coop-migrate
    build:
      context: .
      target: migrate
    restart: "no"
    stdin_open: true
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/app_db}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8443}
        DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/app_db}
    container_name: terlux-web
    restart: unless-stopped
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/app_db}
      AUTH_SECRET: ${AUTH_SECRET:?Definir AUTH_SECRET en el archivo .env}
      PORT: "8443"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8443}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terlux_storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terlux_storage}
      MINIO_BUCKET: ${MINIO_BUCKET:-terlux-files}
      TAILSCALE_IP: ${TAILSCALE_IP:-100.106.108.98}
      TAILSCALE_NETWORK: ${TAILSCALE_NETWORK:-100.64.0.0/10}
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "8443:8443"

  nginx-intranet:
    image: nginx:alpine
    container_name: terlux-nginx-intranet
    restart: unless-stopped
    profiles: ["intranet"]
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-intranet.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  miniodata:
  uploads: