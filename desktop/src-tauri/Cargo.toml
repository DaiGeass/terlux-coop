[package]
name = "terlux-desktop"
version = "1.0.3"
description = "TerLux Coop - Suite Empresarial de Escritorio"
authors = ["TerLux Coop"]
license = "Propietario"
edition = "2021"
rust-version = "1.77"

[lib]
name = "terlux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"

# --- Serialización ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Async / red ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "stream",
  "cookies",
  "rustls-tls",
] }

# --- Base de datos (panel de técnicos, conexión directa por VPN) ---
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

# --- Utilidades ---
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.32"
local-ip-address = "0.6"
mime_guess = "2"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
urlencoding = "2"

# --- Almacén seguro de credenciales (solo Windows / macOS) ---
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
# Permite que Tauri deshabilite la consola en Windows en release
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
